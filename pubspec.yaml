name: ucateci
description: "App para gestionar tu pensum"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.3
  image_picker: ^1.1.2
  intl: ^0.20.2
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.4
  flutter_launcher_icons: ^0.14.4
  flutter_timezone: ^5.0.2
  dynamic_color: ^1.8.1
  local_auth: ^3.0.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  image_path_android: "assets/icon.png"
  image_path_ios: "assets/icon.png"
  min_sdk_android: 21
